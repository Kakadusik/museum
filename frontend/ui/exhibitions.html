<!doctype dhtml lib>

<!-- exhibitions list -->
<div :is="exhibitions">
  <div class="page-header">
    <h1>Выставки</h1>
    <button popovertarget="create-exhibition" class="btn-primary">Добавить выставку</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Название</th>
        <th>Локация</th>
        <th>Описание</th>
        <th>Предметов</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr :each="exhibition in exhibitions">
        <td><a href="/exhibitions/{ exhibition.id }">{ exhibition.title }</a></td>
        <td>{ exhibition.location || '—' }</td>
        <td>{ exhibition.description || '—' }</td>
        <td>{ exhibition.objects_count }</td>
        <td class="actions-cell">
          <div class="actions-buttons">
            <button popovertarget="edit-exhibition" class="btn-small" :onclick="selectExhibition(exhibition)">Изменить</button>
            <button popovertarget="delete-exhibition" class="btn-small btn-danger" :onclick="selectExhibition(exhibition)">Удалить</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <dialog id="create-exhibition" popover>
    <h2 style="margin-top:0">Новая выставка</h2>
    <form class="grid" :onsubmit="createExhibition">
      <label>Название *
        <input name="title" required minlength="2" maxlength="200">
      </label>
      <div class="row">
        <label>Локация
          <input name="location" maxlength="200">
        </label>
      </div>
      <label>Описание
        <textarea name="description" maxlength="2000"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" onclick="this.closest('dialog').hidePopover()">Отмена</button>
        <button type="submit" class="btn-primary">Создать</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-exhibition" popover>
    <h2 style="margin-top:0">Редактировать выставку</h2>
    <form class="grid" :onsubmit="updateExhibition">
      <label>Название *
        <input name="title" value="{ selected.title }" required minlength="2" maxlength="200">
      </label>
      <label>Локация
        <input name="location" value="{ selected.location }" maxlength="200">
      </label>
      <label>Описание
        <textarea name="description" maxlength="2000">{ selected.description }</textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" onclick="this.closest('dialog').hidePopover()">Отмена</button>
        <button type="submit" class="btn-primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-exhibition" popover>
    <h2 style="margin-top:0">Удалить выставку?</h2>
    <p>«{ selected.title }» будет удалена, экспонаты останутся в фондах.</p>
    <form :onsubmit="deleteExhibition">
      <div class="dialog-actions">
        <button type="button" onclick="this.closest('dialog').hidePopover()">Отмена</button>
        <button type="submit" class="btn-danger">Удалить</button>
      </div>
    </form>
  </dialog>

  <script>
    this.exhibitions = []
    this.selected = {}

    selectExhibition(exhibition) {
      this.update({ selected: exhibition })
      const form = this.root.querySelector('#edit-exhibition form')
      if (!form) return
      form.elements.title.value = exhibition.title || ''
      form.elements.location.value = exhibition.location || ''
      form.elements.description.value = exhibition.description || ''
    }

    async load() {
      const data = await fetch('/api/exhibitions').then(r => r.json())
      this.update({ exhibitions: data.exhibitions })
    }

    async createExhibition(e) {
      const data = Object.fromEntries(new FormData(e.target))
      if (!data.description) delete data.description
      if (!data.location) delete data.location
      const res = await fetch('/api/exhibitions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      if (res.ok) {
        document.getElementById('create-exhibition').hidePopover()
        this.load()
      }
    }

    async updateExhibition(e) {
      const data = Object.fromEntries(new FormData(e.target))
      const res = await fetch(`/api/exhibitions/${this.selected.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      if (res.ok) {
        this.root.querySelector('#edit-exhibition').hidePopover()
        this.load()
      }
    }

    async deleteExhibition(e) {
      const res = await fetch(`/api/exhibitions/${this.selected.id}`, { method: 'DELETE' })
      if (res.ok) {
        this.root.querySelector('#delete-exhibition').hidePopover()
        this.load()
      }
    }

    mounted() {
      this.load()
    }
  </script>
</div>
