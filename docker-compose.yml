name: museum-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-museum}
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-museum} -d ${POSTGRES_DB:-museum}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend-dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-museum}:${POSTGRES_PASSWORD:-museum}@db:5432/${POSTGRES_DB:-museum}
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: 1
      AUTO_RELOAD: 1
      FRONTEND_DIST: /app/frontend/.dist
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./docker
      dockerfile: frontend.dev.Dockerfile
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - ./docker/site.dev.yaml:/app/frontend/site.yaml:ro
    depends_on:
      - backend
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata_dev:
